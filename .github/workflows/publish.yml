name: Publish Package

# main -> prod hub (fresh token minted from AUX4_PUBLISHER_* client credentials)
# dev  -> dev hub  (fresh token minted from AUX4_DEV_PUBLISHER_* client
#         credentials, since the dev hub validates against dev SSO). Both paths
#         call aux4/action@v1 command:publish; only the mint endpoint + registry differ.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  unit:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Go vet
        run: go vet ./...

      - name: Go unit tests
        run: go test ./...

  test-linux:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Test
        uses: aux4/action@v1
        with:
          command: test
          build_command: aux4 builder linux

  test-darwin:
    needs: [unit]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Test
        uses: aux4/action@v1
        with:
          command: test
          build_command: aux4 builder darwin

  publish:
    needs: [test-linux, test-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install aux4
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> $GITHUB_PATH

      - name: Build
        run: aux4 build

      # A static AUX4_ACCESS_TOKEN org secret is never refreshed by pkger (it's
      # returned verbatim and goes stale), so mint a fresh short-lived token via
      # client_credentials on every run instead. dev hub validates against dev
      # SSO, so dev and main mint from different client creds / SSO endpoints.
      - name: Mint hub publish token
        id: mint
        env:
          CLIENT_ID: ${{ github.ref_name == 'dev' && secrets.AUX4_DEV_PUBLISHER_CLIENT_ID || secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ github.ref_name == 'dev' && secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET || secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
          SSO_URL: ${{ github.ref_name == 'dev' && 'https://dev.sso.aux4.io/token' || 'https://sso.aux4.io/token' }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Publisher client id/secret not set for ${{ github.ref_name }}"
            exit 1
          fi
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            "$SSO_URL" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::client_credentials mint returned no access_token from $SSO_URL"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          aux4_token: ${{ steps.mint.outputs.token }}
          # dev -> dev hub registry; main -> default (prod) hub
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
